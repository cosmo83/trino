name: Docker Build and Push

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get Trino version
        id: version
        run: |
          TRINO_VERSION=$(./mvnw -f pom.xml --quiet help:evaluate -Dexpression=project.version -DforceStdout --raw-streams)
          echo "trino_version=${TRINO_VERSION}" >> $GITHUB_OUTPUT
          echo "Trino version: ${TRINO_VERSION}"

      - name: Build Trino artifacts
        run: |
          export MAVEN_OPTS="-Xmx3G -XX:+ExitOnOutOfMemoryError"
          ./mvnw clean install -B -V -T 1C -DskipTests -Dmaven.source.skip=true -Dair.check.skip-all -pl '!:trino-docs'
          echo "Disk space after build:"
          df -h

      - name: Clean Maven artifacts (keep server and cli)
        run: |
          ./mvnw clean -pl '!:trino-server,!:trino-cli'
          rm -rf ~/.m2/repository/io/trino/trino-*
          echo "Disk space after Maven clean:"
          df -h

      - name: Build Docker images
        run: |
          cd core/docker
          # Build images for amd64 and arm64 architectures using the existing build script
          ./build.sh -a amd64,arm64
          echo "Disk space after Docker build:"
          df -h

      - name: Tag and push Docker images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TRINO_VERSION="${{ steps.version.outputs.trino_version }}"

          # Get tags from metadata action
          TAGS="${{ steps.meta.outputs.tags }}"

          echo "=== Available tags from metadata ==="
          echo "$TAGS"
          echo "===================================="

          echo "=== Available Docker images ==="
          docker images | grep trino
          echo "================================"

          # For each architecture, tag and push
          for ARCH in amd64 arm64; do
            echo "Processing $ARCH images..."
            SOURCE_TAG="trino:${TRINO_VERSION}-${ARCH}"

            # Check if source image exists
            if ! docker image inspect "${SOURCE_TAG}" > /dev/null 2>&1; then
              echo "ERROR: Source image ${SOURCE_TAG} not found!"
              continue
            fi

            # Tag and push each tag from metadata
            while IFS= read -r TAG; do
              if [ -n "$TAG" ]; then
                TARGET_TAG="${TAG}-${ARCH}"
                echo "Tagging ${SOURCE_TAG} as ${TARGET_TAG}"
                docker tag "${SOURCE_TAG}" "${TARGET_TAG}"
                echo "Pushing ${TARGET_TAG}"
                docker push "${TARGET_TAG}"
              fi
            done <<< "$TAGS"
          done

      - name: Create and push manifest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAGS="${{ steps.meta.outputs.tags }}"

          echo "=== Creating multi-arch manifests ==="

          # Create and push manifest for each tag
          while IFS= read -r TAG; do
            if [ -n "$TAG" ]; then
              echo "Creating manifest for ${TAG}"
              docker buildx imagetools create \
                -t "${TAG}" \
                "${TAG}-amd64" \
                "${TAG}-arm64"
              echo "✓ Manifest created for ${TAG}"
            fi
          done <<< "$TAGS"

          echo "=== All manifests created successfully ==="
